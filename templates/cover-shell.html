<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>01 · 演示文稿主标题</title>
  <link rel="stylesheet" href="../assets/ppt.css" />
</head>
<body>
  <div class="viewport">
    <div class="frame">
      <div class="stage">
        <section class="slide layout-cover" data-page="1">
          <img class="brand-logo brand-logo--white" src="../assets/brand/logo-white.png" alt="品牌标识" />
          <main class="cover-content">
            <div class="cover-title-box">
              <h1>演示文稿主标题</h1>
            </div>
            <div class="cover-rule" aria-hidden="true">
              <span class="cover-rule__blue">&#160;</span>
              <span class="cover-rule__fade">&#160;</span>
            </div>
            <p class="subtitle">封面副标题</p>
            <div class="cover-meta">
              <p>演讲者：姓名</p>
              <p>2026年7月</p>
            </div>
          </main>
        </section>
      </div>
    </div>
  </div>
  <script src="../assets/deck.js"></script>
  <script src="../assets/slide.js"></script>
</body>
</html>
