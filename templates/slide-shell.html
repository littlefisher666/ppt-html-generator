<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NN · 页面主标题</title>
  <link rel="stylesheet" href="../assets/ppt.css" />
</head>
<body>
  <div class="viewport">
    <div class="frame">
      <div class="stage">
        <section class="slide layout-content" data-page="NN">
          <img class="brand-logo brand-logo--color" src="../assets/brand/logo-color.png" alt="品牌标识" />
          <div class="master-rule" aria-hidden="true">
            <span class="master-rule__fade">&#160;</span>
            <span class="master-rule__blue">&#160;</span>
            <span class="master-rule__light">&#160;</span>
          </div>

          <header class="slide-heading">
            <h1>页面主标题</h1>
            <p class="subtitle">页面副标题</p>
          </header>

          <main class="slide-content">
            <div class="content-grid content-grid--two">
              <section class="content-block">
                <h2>内容标题</h2>
                <ul class="bullets">
                  <li>使用恒达母版正文安全区组织内容。</li>
                  <li>正文使用共享整数 pt token，不用任意小字号硬塞。</li>
                  <li>底部为预览导航预留空间，导出时自动隐藏导航。</li>
                </ul>
              </section>
              <section class="content-block">
                <h2>第二内容区</h2>
                <p>同一语义在整个 deck 中复用 class；内容过多时缩短文案或拆页。</p>
              </section>
            </div>
          </main>
        </section>
      </div>
    </div>
  </div>
  <script src="../assets/deck.js"></script>
  <script src="../assets/slide.js"></script>
</body>
</html>
